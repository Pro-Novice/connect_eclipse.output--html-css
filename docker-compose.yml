version: '3.8'

services:
  validator:
    image: hyperledger/besu:latest
    container_name: ${NODE_NAME}
    restart: unless-stopped
    command: [
      "--config-file=/opt/besu/common-config.toml",
      "--identity=${NODE_NAME}",
      "--p2p-host=${P2P_HOST}",
      "--p2p-port=${P2P_PORT}",
      "--bootnodes=${BOOTNODES}",
      "--genesis-file=/opt/besu/genesis.json",
      "--data-path=/opt/besu/data",
      "--rpc-http-enabled=true",
      "--rpc-http-host=0.0.0.0",
      "--rpc-http-port=8545",
      "--host-allowlist=*",
      "--rpc-http-api=ETH,NET,WEB3,QBFT",
      "--rpc-ws-enabled=true",
      "--rpc-ws-host=0.0.0.0",
      "--rpc-ws-port=8546",
      "--rpc-ws-api=ETH,NET,WEB3,QBFT",
      "--metrics-enabled=true",
      "--metrics-host=0.0.0.0",
      "--metrics-port=9545",
      "--logging=INFO"
    ]
    ports:
      - "${RPC_PORT}:8545"
      - "${P2P_PORT}:${P2P_PORT}/tcp"
      - "${P2P_PORT}:${P2P_PORT}/udp"
      - "8546:8546"            # WebSocket
      - "9545:9545"            # Prometheus metrics
    volumes:
      - ./common-config.toml:/opt/besu/common-config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/${NODE_NAME}/key:/opt/besu/key:ro
      - ./data:/opt/besu/data
