services:
  blockscout-db:
    image: postgres:14
    container_name: blockscout-postgres
    restart: always
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: blockscout_pass
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data
    networks:
      - agri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  blockscout-redis:
    image: redis:alpine
    container_name: blockscout-redis
    restart: always
    networks:
      - agri-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  blockscout-backend:
    platform: linux/amd64
    image: ayushrawat14/c3ihub-blockscout-backend:v1.0
    container_name: blockscout-backend
    restart: always
    stop_grace_period: 5m
    depends_on:
      - blockscout-db
      - blockscout-redis
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      ETHEREUM_JSONRPC_VARIANT: 'besu'
      ETHEREUM_JSONRPC_HTTP_URL: http://rajasthan-blockchain-besu-validator4-1:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://rajasthan-blockchain-besu-validator4-1:8545/
      
      # Enable indexer but reduce load
      DISABLE_INDEXER: 'false'
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: 'true'
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: 'true'
      INDEXER_DISABLE_TOKEN_INSTANCE_FETCHER: 'true'
      

      INDEXER_MEMORY_LIMIT: '2'
      POOL_SIZE: '10'
      POOL_SIZE_API: '5'
      
      DATABASE_URL: postgresql://blockscout:blockscout_pass@blockscout-db:5432/blockscout?ssl=false
      ECTO_USE_SSL: 'false'
      SECRET_KEY_BASE: '56NtB48ear7wMSf0IQuWDAAazhpb31qyc7GiyspBP57UxmWFz7aFN'
      CHAIN_ID: '1337'
      PORT: 4000
      COIN: 'RAJ'
      NETWORK: 'C3ihub Rajasthan Agriculture'
      SUBNETWORK: 'Seed License'
      REDIS_URL: 'redis://blockscout-redis:6379'
      FETCH_REWARDS_WAY: 'manual'
      DISABLE_EXCHANGE_RATES: 'true'
      API_V2_ENABLED: 'true'
      MIX_ENV: 'prod'
      
      # Allow CORS from frontend
      API_V2_CORS_ALLOWED_ORIGINS: 'http://localhost:3001'
      
    ports:
      - "4000:4000"
    networks:
      - agri-network
      - qbft_testnet
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  blockscout-frontend:
    image: ayushrawat14/c3ihub-frontend:v2.0
    container_name: blockscout-frontend
    restart: always
    depends_on:
      - blockscout-backend
    environment:
      # App settings
      NEXT_PUBLIC_APP_HOST: localhost
      NEXT_PUBLIC_APP_PORT: 3001
      NEXT_PUBLIC_APP_PROTOCOL: http
      
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PORT: 4000
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_BASE_PATH: ""
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_API_SPEC_URL: https://raw.githubusercontent.com/blockscout/blockscout-api-v2-swagger/main/swagger.yaml
      
      # Network
      NEXT_PUBLIC_NETWORK_NAME: C3IHub Rajasthan Agriculture
      NEXT_PUBLIC_NETWORK_SHORT_NAME: RAJ
      NEXT_PUBLIC_NETWORK_ID: '1337'
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: RAJ Token
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: RAJ
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: 18
      NEXT_PUBLIC_IS_TESTNET: 'true'
      
      # Branding
      NEXT_PUBLIC_NETWORK_LOGO: https://storage.googleapis.com/iitk-app/c3i-logo-main.png
      NEXT_PUBLIC_NETWORK_LOGO_DARK: https://storage.googleapis.com/iitk-app/c3i-logo-main.png
      NEXT_PUBLIC_NETWORK_ICON: https://storage.googleapis.com/iitk-app/c3i-logo-main.png
      NEXT_PUBLIC_NETWORK_ICON_DARK: https://storage.googleapis.com/iitk-app/c3i-logo-main.png
      NEXT_PUBLIC_PROMOTE_BLOCKSCOUT_IN_TITLE: 'false'
      
      # Brand
      NEXT_PUBLIC_BRAND_NAME: C3IHub Explorer
      NEXT_PUBLIC_BRAND_DESCRIPTION: C3IHub Explorer for Rajasthan Agriculture Network
      NEXT_PUBLIC_FOOTER_LINKS: '[{"title":"C3IHub","links":[{"text":"Docs","url":"https://c3ihub.org"}]}]'
      
      # Features
      NEXT_PUBLIC_AD_BANNER_PROVIDER: 'none'
      NEXT_PUBLIC_AD_TEXT_PROVIDER: 'none'
      
    ports:
      - "3001:3000"
    networks:
      - agri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  blockscout-db-data:

networks:
  agri-network:
    name: rajasthan_agri_backend_agri-network
    external: true
  qbft_testnet:
    name: rajasthan-blockchain-besu_qbft_testnet
    external: true
